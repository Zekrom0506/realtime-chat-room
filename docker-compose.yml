services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine

  # first copy of the server
  server1:
    build: ./server
    environment:
      - PORT=5000
      - MONGO_URL=mongodb://mongo:27017/chatroom
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev_secret_change_me}
      - SERVER_NAME=server-1
    depends_on:
      - mongo
      - redis
    restart: on-failure

  # second copy of the server, same code, different name
  server2:
    build: ./server
    environment:
      - PORT=5000
      - MONGO_URL=mongodb://mongo:27017/chatroom
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev_secret_change_me}
      - SERVER_NAME=server-2
    depends_on:
      - mongo
      - redis
    restart: on-failure

  # React app (built and served as static files)
  client:
    build: ./client

  # load balancer, the only container that is open to the outside
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server1
      - server2
      - client

volumes:
  mongo_data:
