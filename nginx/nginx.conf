# the two copies of the Node.js server
# nginx sends requests to them in turns (round robin)
upstream chat_servers {
    server server1:5000;
    server server2:5000;
}

server {
    listen 80;

    # REST API requests
    location /api/ {
        proxy_pass http://chat_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket connections
    # the Upgrade and Connection headers are needed to switch from HTTP to WebSocket
    location /ws {
        proxy_pass http://chat_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # keep idle chat connections open for up to 1 hour
        proxy_read_timeout 3600s;
    }

    # everything else is the React app
    location / {
        proxy_pass http://client:80;
        proxy_set_header Host $host;
    }
}
